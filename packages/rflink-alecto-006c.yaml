  - platform: template
    id: alecto_2_temp
    name: "Alecto 2 hőmérséklet"
    icon: mdi:thermometer
    internal: false
    entity_category: ""
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: never

  - platform: template
    id: alecto_3_temp
    name: "Alecto 3 hőmérséklet"
    icon: mdi:thermometer
    internal: false
    entity_category: ""
    unit_of_measurement: "°C"
    device_class: temperature
