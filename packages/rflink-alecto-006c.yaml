# Alecto V1 display package for the original Plugin_030 output (v0.2.0.8).
#
# The bridge forwards the original JSON without SLOT/CHANNEL/RFBASE additions.
# This display-only package assigns the first three temperature-sensor RF IDs
# to the existing HA slots in arrival order, until reboot. It does not rewrite
# RF values or wait for additional measurements. The full emitted RF ID is used;
# a changed ID is a different sensor for display purposes.
#
# Acceptance, checksum, range and duplicate checks belong to Plugin_030 only.
# Its output does not contain a separate channel field, so the existing channel
# diagnostic entities show "Nincs adat". No channel is guessed from the RF ID.
#
# Existing slot-1 ESPHome IDs and display names are intentionally retained so
# current Home Assistant automations do not need to change.
# This Alecto model does not provide humidity, so no humidity entity is created.
# Requirement: RFLink Plugin 030 must be enabled at runtime.

esphome:
  on_boot:
    - priority: 1000
      then:
        - lambda: |-
            id(rf_bridge).register_plugin_diagnostic_sensor(30, id(alecto_006c_temp));
            id(rf_bridge).register_plugin_diagnostic_binary_sensor(30, id(alecto_006c_bat));
            id(rf_bridge).register_plugin_diagnostic_text_sensor(30, id(alecto_006c_current_id));
            id(rf_bridge).register_plugin_diagnostic_text_sensor(30, id(alecto_1_channel));
            id(rf_bridge).register_plugin_diagnostic_sensor(30, id(alecto_2_temp));
            id(rf_bridge).register_plugin_diagnostic_binary_sensor(30, id(alecto_2_bat));
            id(rf_bridge).register_plugin_diagnostic_text_sensor(30, id(alecto_2_current_id));
            id(rf_bridge).register_plugin_diagnostic_text_sensor(30, id(alecto_2_channel));
            id(rf_bridge).register_plugin_diagnostic_sensor(30, id(alecto_3_temp));
            id(rf_bridge).register_plugin_diagnostic_binary_sensor(30, id(alecto_3_bat));
            id(rf_bridge).register_plugin_diagnostic_text_sensor(30, id(alecto_3_current_id));
            id(rf_bridge).register_plugin_diagnostic_text_sensor(30, id(alecto_3_channel));

json:

