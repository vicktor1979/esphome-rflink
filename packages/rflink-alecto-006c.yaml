script:
  - id: alecto_006c_process
    mode: queued
    max_runs: 5
    parameters:
      message: string
    then:
      - lambda: |-
          const bool valid = json::parse_json(message, [&](JsonObject root) -> bool {
            namespace data = esphome::rflink_data;
            const std::string protocol = root["NAME"] | "";
            if (protocol != "Alecto V1") return true;

            const int slot = root["SLOT"] | 0;
            const int channel = root["CHANNEL"] | 0;
            const std::string device = root["ID"] | "";
            if (slot < 1 || slot > 3 || channel < 1 || channel > 3 || device.empty()) return true;
            const std::string channel_text = std::to_string(channel);
            const std::string battery = root["BAT"] | "";
            const auto temperature = data::number(root, data::TEMP);
            const bool has_temp = temperature.present;
            const bool has_battery = !root["BAT"].isNull();

            if (slot == 1) {
              data::publish_text(id(alecto_006c_current_id), device);
              data::publish_text(id(alecto_1_channel), channel_text);
              if (has_temp) data::publish_number(id(alecto_006c_temp), temperature, false);
              data::publish_binary(id(alecto_006c_bat), data::binary_value(battery, "LOW", "OK"), has_battery, false);
            } else if (slot == 2) {
              data::publish_text(id(alecto_2_current_id), device);
              data::publish_text(id(alecto_2_channel), channel_text);
              if (has_temp) data::publish_number(id(alecto_2_temp), temperature, false);
              data::publish_binary(id(alecto_2_bat), data::binary_value(battery, "LOW", "OK"), has_battery, false);
            } else {
              data::publish_text(id(alecto_3_current_id), device);
              data::publish_text(id(alecto_3_channel), channel_text);
              if (has_temp) data::publish_number(id(alecto_3_temp), temperature, false);
              data::publish_binary(id(alecto_3_bat), data::binary_value(battery, "LOW", "OK"), has_battery, false);
            }
            return true;
          });
          if (!valid)
            ESP_LOGW("rflink.device", "Hibas JSON az Alecto V1 feldolgozasakor.");

# The on_message list is appended to the main YAML rflink.on_message handlers.
rflink:
  on_message:
    - then:
        - script.execute:
            id: alecto_006c_process
            message: !lambda return x;
