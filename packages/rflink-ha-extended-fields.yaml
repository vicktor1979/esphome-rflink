# Optional v0.1.7 diagnostic fields. Include alongside data-only, not instead of it.
# These are values from the most recent decoded packet, not per-device measurements.
# WINDIR_DEG is already in degrees; do NOT feed it to legacy WINDIR (0..15).
json:
sensor:
  - platform: template
    id: rflink_extended_channel
    name: "RF utolsó csatorna"
    icon: mdi:numeric
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: never
  - platform: template
    id: rflink_extended_direction
    name: "RF utolsó szélirány fokban"
    icon: mdi:compass
    entity_category: diagnostic
    accuracy_decimals: 0
    unit_of_measurement: "°"
    update_interval: never
script:
  - id: rflink_extended_fields_process
    mode: queued
    max_runs: 5
    parameters:
      message: string
    then:
      - lambda: |-
          json::parse_json(message, [&](JsonObject root) -> bool {
            namespace data = esphome::rflink_data;
            data::publish_number(id(rflink_extended_channel), data::number(root, data::CHAN), true);
            data::publish_number(id(rflink_extended_direction), data::number(root, data::WINDIR_DEG), true);
            return true;
          });
rflink:
  on_message:
    - then:
        - script.execute:
            id: rflink_extended_fields_process
            message: !lambda return x;
