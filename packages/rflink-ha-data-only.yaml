  restore_value: false
  initial_value: '""'
- id: rflink_api_snapshot_pending
  type: bool
  restore_value: false
  initial_value: 'false'
- id: rflink_api_have_packet
  type: bool
  restore_value: false
  initial_value: 'false'
- id: rflink_api_last_packet_ms
  type: uint32_t
  restore_value: false
  initial_value: '0'
- id: rflink_api_snapshot_max_us
  type: uint32_t
  restore_value: false
  initial_value: '0'
