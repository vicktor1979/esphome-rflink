# v0.1.9: data fields only; compact last-message display. Remote events are configured in the device YAML.
# Replace all-data with this package; NEVER include both at once.
# RF events: immediate. Latest decoded packet diagnostic snapshot: at most once per second.
# Missing fields are cleared. Do not use multi-device snapshots as permanent room sensors.
# Per-device field packages: generate with tools/make_rf_device.py.
# Full JSON parts are optional. The radio dump remains OFF.

substitutions:
  rflink_full_json_parts: 'false'
  rflink_api_snapshot_interval: 1s
json:
globals:
- id: rflink_api_packet_count
  type: uint32_t
  restore_value: false
  initial_value: '0'
- id: rflink_api_pending_json
