interval:
- interval: ${rflink_api_snapshot_interval}
  then:
  - lambda: |-
      if (id(rflink_api_snapshot_pending)) {
        id(rflink_api_snapshot_pending) = false;
        id(rflink_api_snapshot).execute(id(rflink_api_pending_json));
      }
