# v0.1.5: ALL 48 available RX plugins, API-first + fields + EV1527 gestures.
# Requires the v0.1.5 stage_sources.py and complete component/package set.
# Original RFLink/Plugins files stay unchanged. TX is NOT implemented.
substitutions:
  rf_api_settle_ms: "5000"
  rflink_full_json_parts: "false"
  rflink_api_snapshot_interval: 1s

esphome:
  name: rflink-esphome
  friendly_name: RFLink ESPHome
  on_boot:
    priority: -100
    then:
      - lambda: |-
          id(rf_bridge).set_decode_enabled(false);
          ESP_LOGI("rflink.auto", "v0.1.5: API-first auto gate; all RX plugins + full RF fields + gestures");

esp8266:
  board: nodemcuv2

# Keep all-data; add gestures. Do NOT load the obsolete rflink-ha-api.yaml too.
packages:
  rflink_api:
    url: https://github.com/vicktor1979/esphome-rflink
    ref: main
    refresh: 0s
    files:
      - packages/rflink-ha-all-data.yaml
      - packages/rflink-ha-gestures.yaml

external_components:
  - source: github://vicktor1979/esphome-rflink@main
    components: [rflink]
    refresh: 0s

api:
  id: api_main
  encryption:
    key: !secret rflink_api_key
  reboot_timeout: 0s

wifi:
  id: wifi_main
  ssid: !secret wifi_ssid
  password: !secret wifi_password

logger:
  level: DEBUG

ota:
  - platform: esphome
    password: !secret ota_password
    on_begin:
      then:
        - lambda: |-
            id(rf_ota_active) = true;
            id(rf_bridge).set_decode_enabled(false);
    on_error:
      then:
        - lambda: id(rf_ota_active) = false;

time:
  - platform: sntp
    id: rflink_time
    timezone: Europe/Budapest

text_sensor:
  - platform: wifi_info
    ip_address:
      id: rflink_ip
      internal: true
    mac_address:
      id: rflink_mac
      internal: true

sensor:
  - platform: wifi_signal
    id: rflink_rssi
    internal: true
    update_interval: 60s

globals:
  - id: rf_ota_active
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: rf_probe_api_states
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: rf_probe_frames
    type: uint32_t
    restore_value: false
    initial_value: '0'

remote_receiver:
  id: rf_receiver
  pin:
    number: GPIO5
    inverted: false
    mode: INPUT
  filter: 100us
  idle: 5ms
  buffer_size: 1000b
  # NO dump. Only one RAM counter; no per-frame log or HA publication.
  on_raw:
    then:
      - lambda: ++id(rf_probe_frames);

rflink:
  id: rf_bridge
  receiver_id: rf_receiver
  rx_plugins: all
  # configured: the 47 RX plugins in the original config (not Plugin_083).
  # To isolate runtime issues, this can still be [61] or [34, 40, 61].
  # All-plugin compilation is not a guarantee of every protocol's RF reliability.
  log_messages: true
  on_message:
    - then:
        - script.execute:
            id: rflink_api_process
            message: !lambda return x;

# Keep the previous HA switch name/ID. ON now means permission for AUTOMATIC decoding.
# The actual decoder state is shown by the binary sensor below.
switch:
  - platform: template
    id: rf_decode_test
    name: "RFLink dekódolás próba"
    icon: mdi:radio-tower
    entity_category: config
    optimistic: true
    restore_mode: ALWAYS_ON
    turn_off_action:
      - lambda: id(rf_bridge).set_decode_enabled(false);

binary_sensor:
  - platform: template
    id: rf_decode_active
    name: "RFLink dekódolás aktív"
    entity_category: diagnostic
    icon: mdi:radio-tower

interval:
  - interval: 1s
    then:
      - if:
          condition:
            api.connected:
              state_subscription_only: true
          then:
            - lambda: id(rf_probe_api_states) = true;
          else:
            - lambda: id(rf_probe_api_states) = false;
      - lambda: |-
          static esphome::rflink_data::ReadyGate gate;
          const bool ready = id(wifi_main).is_connected() &&
              id(rf_probe_api_states) && id(rf_decode_test).state && !id(rf_ota_active);
          const bool enable = gate.update(millis(), ready, ${rf_api_settle_ms});
          const bool changed = id(rf_bridge).is_decode_enabled() != enable;
          id(rf_bridge).set_decode_enabled(enable);
          if (!id(rf_decode_active).has_state() || id(rf_decode_active).state != enable)
            id(rf_decode_active).publish_state(enable);
          if (changed) {
            ESP_LOGI("rflink.auto", "DECODE=%s; api_states=%s; wifi=%s",
                     enable ? "ON" : "OFF", id(rf_probe_api_states) ? "YES" : "NO",
                     id(wifi_main).is_connected() ? "CONNECTED" : "DISCONNECTED");
          }
  - interval: 10s
    then:
      - lambda: |-
          ESP_LOGI("rflink.diag",
              "AUTO=%s; DECODE=%s; api_states=%s; uptime=%lu s; wifi=%s; heap=%u B; max_block=%u B; frag=%u%%; frames=%lu; decoded=%lu; calls=%lu; skipped=%lu; decode_max_us=%lu; callback_max_us=%lu; snapshot_max_us=%lu; observed=%lu; frame_callback_max_us=%lu",
              id(rf_decode_test).state ? "ON" : "OFF",
              id(rf_bridge).is_decode_enabled() ? "ON" : "OFF",
              id(rf_probe_api_states) ? "YES" : "NO",
              static_cast<unsigned long>(millis() / 1000),
              id(wifi_main).is_connected() ? "CONNECTED" : "DISCONNECTED",
              static_cast<unsigned>(ESP.getFreeHeap()),
              static_cast<unsigned>(ESP.getMaxFreeBlockSize()),
              static_cast<unsigned>(ESP.getHeapFragmentation()),
              static_cast<unsigned long>(id(rf_probe_frames)),
              static_cast<unsigned long>(id(rflink_api_packet_count)),
              static_cast<unsigned long>(id(rf_bridge).get_decode_calls()),
              static_cast<unsigned long>(id(rf_bridge).get_skipped_frames()),
              static_cast<unsigned long>(id(rf_bridge).get_max_decode_us()),
              static_cast<unsigned long>(id(rf_bridge).get_max_callback_us()),
              static_cast<unsigned long>(id(rflink_api_snapshot_max_us)),
              static_cast<unsigned long>(id(rf_bridge).get_observed_frames()),
              static_cast<unsigned long>(id(rf_bridge).get_max_frame_callback_us()));
