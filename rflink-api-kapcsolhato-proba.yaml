# DIAGNOSTIC firmware, NOT a confirmed fix. Requires the two v0.1.2-diag files.
# Both original plugins (001 + 061) stay compiled; RF capture stays active.
# Decoder starts OFF. First establish HA API, then use the software switch.
# Each ON trial lasts 60 seconds, then returns to OFF without a reboot.
# MQTT absent. API encryption and all Wi-Fi / GPIO / receiver timing settings unchanged.
# Never commit secrets.yaml. Keep your current working YAML and component backup.

esphome:
  name: rflink-esphome
  friendly_name: RFLink ESPHome
  on_boot:
    # All components are set up, but no normal receiver loop has run yet.
    priority: -100
    then:
      - lambda: |-
          id(rf_bridge).set_decode_enabled(false);

esp8266:
  board: nodemcuv2

packages:
  rflink_api: github://vicktor1979/esphome-rflink/packages/rflink-ha-api.yaml@main

external_components:
  - source: github://vicktor1979/esphome-rflink@main
    components: [rflink]
    refresh: 0s

api:
  id: api_main
  encryption:
    key: !secret rflink_api_key
  reboot_timeout: 0s

wifi:
  id: wifi_main
  ssid: !secret wifi_ssid
  password: !secret wifi_password

logger:
  level: DEBUG

ota:
  - platform: esphome
    password: !secret ota_password

time:
  - platform: sntp
    id: rflink_time
    timezone: Europe/Budapest

text_sensor:
  - platform: wifi_info
    ip_address:
      id: rflink_ip
      internal: true
    mac_address:
      id: rflink_mac
      internal: true

sensor:
  - platform: wifi_signal
    id: rflink_rssi
    internal: true
    update_interval: 60s

# Diagnosztikai szamlalok; az RFLink-dekoder most mar engedelyezett.
# A szamlalok a HA-csomag globals-listajaval osszefesulhetok.
globals:
  - id: rf_probe_api_any
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: rf_probe_api_states
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: rf_probe_frames
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: rf_probe_max_items
    type: uint32_t
    restore_value: false
    initial_value: '0'

remote_receiver:
  id: rf_receiver
  pin:
    number: GPIO5
    inverted: false
    mode: INPUT
  filter: 100us
  idle: 5ms
  buffer_size: 1000b
  # NINCS dump. Ez a callback csak ket memoriabeli szamlalot frissit.
  # Ez az on_raw nem ir naplot es nem frissit HA-entitast.
  # A dekodolast az alabbi kulon rflink: blokk vegzi.
  on_raw:
    then:
      - lambda: |-
          ++id(rf_probe_frames);
          const uint32_t items = static_cast<uint32_t>(x.size());
          if (items > id(rf_probe_max_items))
            id(rf_probe_max_items) = items;

# EV1527: the tested 085372 and the previous 01fac2 remote.
# Do not change this to configured/all for this comparison.
rflink:
  id: rf_bridge
  receiver_id: rf_receiver
  rx_plugins: [61]
  log_messages: true
  on_message:
    then:
      - script.execute:
          id: rflink_api_process
          message: !lambda return x;

# This is a SOFTWARE gate, not a GPIO/power switch. Restarts always start OFF.
# The template package's existing script list is merged by ESPHome.
switch:
  - platform: template
    id: rf_decode_test
    name: "RFLink dekódolás próba"
    icon: mdi:radio-tower
    entity_category: config
    restore_mode: ALWAYS_OFF
    lambda: return id(rf_bridge).is_decode_enabled();
    turn_on_action:
      - script.execute: rf_decode_test_window
    turn_off_action:
      - script.stop: rf_decode_test_window
      - lambda: id(rf_bridge).set_decode_enabled(false);

script:
  - id: rf_decode_test_window
    mode: restart
    then:
      - lambda: id(rf_bridge).set_decode_enabled(true);
      # Non-blocking ESPHome delay: turns decoding off even if the HA link fails.
      # No component is removed/rebuilt between the OFF and ON phases.
      - delay: 60s
      - lambda: |-
          id(rf_bridge).set_decode_enabled(false);
          ESP_LOGI("rflink.diag", "60 s test finished; decode OFF again");

interval:
  - interval: 10s
    then:
      # Use supported YAML conditions instead of version-dependent C++ overloads.
      - if:
          condition:
            api.connected:
          then:
            - lambda: id(rf_probe_api_any) = true;
          else:
            - lambda: id(rf_probe_api_any) = false;
      - if:
          condition:
            api.connected:
              state_subscription_only: true
          then:
            - lambda: id(rf_probe_api_states) = true;
          else:
            - lambda: id(rf_probe_api_states) = false;
      - lambda: |-
          ESP_LOGI(
              "rflink.diag",
              "RX=ON; DECODE=%s; api_any=%s; api_states=%s; uptime=%lu s; wifi=%s; heap=%u B; max_block=%u B; frag=%u%%; frames=%lu; decoded=%lu; calls=%lu; skipped=%lu; decode_max_us=%lu; callback_max_us=%lu",
              id(rf_bridge).is_decode_enabled() ? "061" : "OFF",
              id(rf_probe_api_any) ? "YES" : "NO",
              id(rf_probe_api_states) ? "YES" : "NO",
              static_cast<unsigned long>(millis() / 1000),
              id(wifi_main).is_connected() ? "CONNECTED" : "DISCONNECTED",
              static_cast<unsigned>(ESP.getFreeHeap()),
              static_cast<unsigned>(ESP.getMaxFreeBlockSize()),
              static_cast<unsigned>(ESP.getHeapFragmentation()),
              static_cast<unsigned long>(id(rf_probe_frames)),
              static_cast<unsigned long>(id(rflink_api_packet_count)),
              static_cast<unsigned long>(id(rf_bridge).get_decode_calls()),
              static_cast<unsigned long>(id(rf_bridge).get_skipped_frames()),
              static_cast<unsigned long>(id(rf_bridge).get_max_decode_us()),
              static_cast<unsigned long>(id(rf_bridge).get_max_callback_us())
          );
