# Fragment: merge into the existing sensor list. Requires v0.2.1.2.
# external_components.components must include rflink_sensor.
# Replace example RF IDs with the complete IDs emitted by your own devices.
# Enable plugins: Mebus 040, Alecto V1 030. No per-device script/package needed.
sensor:
  - platform: rflink_sensor
    id: mebus_temp
    name: "Mebus hőmérséklet"
    rflink_id: rf_bridge
    protocol: "Mebus"
    rf_id: "e501"
    field: TEMP

  - platform: rflink_sensor
    id: alecto_006c_temp
    name: "Alecto 006C hőmérséklet"
    rflink_id: rf_bridge
    protocol: "Alecto V1"
    rf_id: "006c"
    field: TEMP

  - platform: rflink_sensor
    id: alecto_006c_battery
    name: "Alecto 006C elemállapot"
    rflink_id: rf_bridge
    protocol: "Alecto V1"
    rf_id: "006c"
    field: BAT
    # LOW=0, OK=100. Two-state status, NOT measured battery charge.
    # No BAT field means no update. The current Mebus plugin has no BAT output.
