# RFLink ESPHome – stable basic configuration example.
# Configuration: v0.2.1.2; ESPHome >= 2026.9.0.
# Sources track main so a manual GitHub upload needs no release tag.
#
# ESP8266 / NodeMCU v2 example using rxgate2.
# Native Home Assistant API, RF learning and runtime plugin control.
# The original RFLink/Plugins sources remain unchanged.
# TX is not implemented.
substitutions:
  rflink_full_json_parts: "false"
  rflink_api_snapshot_interval: 1s

esphome:
  name: rflink-esphome
  friendly_name: RFLink ESPHome

esp8266:
  board: nodemcuv2

# Data only. Remote definitions are below. Remove old all-data/gestures packages.
packages:
  rflink_api:
    url: https://github.com/vicktor1979/esphome-rflink
    ref: main
    refresh: 5min
    files:
      - packages/rflink-ha-data-only.yaml

external_components:
  - source: github://vicktor1979/esphome-rflink@main
    components: [rflink, remote_receiver, rflink_remote, rflink_sensor]
    refresh: 5min

api:
  encryption:
    key: !secret rflink_api_key
  reboot_timeout: 0s

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

logger:
  level: DEBUG  # Compile DEBUG support for the optional RFLink log switch.
  initial_level: INFO  # Keep normal runtime logging quiet.
  # The RFLink tag may log at DEBUG; the HA switch controls message emission.
  logs:
    rflink: DEBUG

ota:
  - platform: esphome
    # Reuses api.encryption.key. Existing devices: see UPDATE_v0.2.0.7_HU.md.
    encryption:
    # The RFLink component owns the full stop/restart sequence.
    on_begin:
      then:
        - lambda: id(rf_bridge).set_ota_active(true);
    on_error:
      then:
        - lambda: id(rf_bridge).set_ota_active(false);

remote_receiver:
  id: rf_receiver
  # Working NodeMCU/SRX882 capture mode; see UPDATE_v0.2.0.9_HU.md.
  capture_mode: rflink_polling
  capture_enabled: false  # stored BEFORE setup: no RX interrupt while connecting
  high_frequency: false  # Polling requests its own fast loop when capture is enabled
  pin:
    number: GPIO5
    inverted: false
    mode: INPUT
  filter: 100us
  idle: 5ms
  buffer_size: 1200b
  # No raw dump/logging in normal operation. Frame/recovery counters are internal.

rflink:
  id: rf_bridge
  receiver_id: rf_receiver

  rx_plugins: all
  plugin_profile: legacy

  # Built-in Wi-Fi + HA API gate, 5 s settle, monitoring/build/health entities.
  # Replaces the old YAML globals + 1 s/10 s interval lambdas.
  auto_start: true

  # All legacy decoders are compiled, but only the listed plugins
  # can be enabled at runtime.
  # Plugin 001 is always enabled.
  # Plugin 254 is the unsupported-signal diagnostic fallback
  # and defaults to OFF.
  # Runtime plugin switches. Listed plugins restore their last state;
  # Plugin 254 is the only exception and always starts OFF.
  plugin_switches: [30, 40, 61, 254]

  # Fast production default. Turn on the HA switch below only while debugging.
  log_messages: false

  on_message:
    - then:
        - script.execute:
            id: rflink_api_process
            message: !lambda return x;

switch:
  # The getter reflects automatic timeout too; learning is OFF after reboot.
  - platform: template
    id: rf_learning_switch
    name: "RF tanuló mód"
    icon: mdi:remote
    entity_category: config
    lambda: return id(rf_remotes).is_learning_enabled();
    turn_on_action:
      - lambda: id(rf_remotes).set_learning_enabled(true);
    turn_off_action:
      - lambda: id(rf_remotes).set_learning_enabled(false);

  - platform: template
    id: rf_verbose_log
    name: "RFLink részletes napló"
    icon: mdi:text-box-search-outline
    entity_category: diagnostic
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - lambda: id(rf_bridge).set_log_messages(true);
    turn_off_action:
      - lambda: id(rf_bridge).set_log_messages(false);

# A future OTA can be performed with RF completely inactive in safe mode.
button:
  - platform: safe_mode
    name: "RFLink OTA helyreállítás"
    entity_category: config

  - platform: template
    name: "RF tanulás indítása"
    icon: mdi:remote
    entity_category: config
    on_press:
      - lambda: id(rf_remotes).set_learning_enabled(true);


# v0.2.0.1: shared timing and learning. No hard-coded remote identities here.

rflink_remote:
  id: rf_remotes
  rflink_id: rf_bridge
  timing:
    release_timeout: 180ms
    hold_release_timeout: 450ms
    repeat_fresh_timeout: 180ms
    multi_click_timeout: 350ms
    hold_time: 700ms
    repeat_interval: 250ms
    max_press_time: 30s
  learning:
    enabled: false
    duration: 60s
    max_signals: 4
    min_frames: 3
    log_events: true
    signal:
      id: rf_learning_signal
      name: "RF tanuló jel"
    gesture:
      id: rf_learning_gesture
      name: "RF tanuló gesztus"

# Add/delete remotes HERE. One entry = one exact protocol/ID/button/command.
# Quoting numeric-looking RF codes is important: do not lose leading zeros.
# Remote examples:
#   examples/fragments/new-ev1527-remote.yaml
#   examples/fragments/ev1527-light-control.yaml
#   examples/fragments/generic-message-protocol.yaml


# Fragment: merge into the existing sensor list. Requires v0.2.1.2.
# external_components.components must include rflink_sensor.
# Replace example RF IDs with the complete IDs emitted by your own devices.
# Enable plugins: Mebus 040, Alecto V1 030. No per-device script/package needed.
sensor:
  - platform: rflink_sensor
    id: mebus_temp
    name: "Mebus hőmérséklet"
    rflink_id: rf_bridge
    protocol: "Mebus"
    rf_id: "e501"
    field: TEMP

  - platform: rflink_sensor
    id: alecto_006c_temp
    name: "Alecto 006C hőmérséklet"
    rflink_id: rf_bridge
    protocol: "Alecto V1"
    rf_id: "006c"
    field: TEMP

  - platform: rflink_sensor
    id: alecto_006c_battery
    name: "Alecto 006C elemállapot"
    rflink_id: rf_bridge
    protocol: "Alecto V1"
    rf_id: "006c"
    field: BAT
    # LOW=0, OK=100. Two-state status, NOT measured battery charge.
    # No BAT field means no update. The current Mebus plugin has no BAT output.

  # Diagnostics only: 5-minute refresh, independent of RF/device sensor updates.
  - id: !extend rflink_api_packet_age
    update_interval: 5min
