# RFLink ESPHome – stable basic configuration example.
# Release: v0.1.9
#
# ESP8266 / NodeMCU v2 example using rxgate2.
# Native Home Assistant API, RF learning and runtime plugin control.
# The original RFLink/Plugins sources remain unchanged.
# TX is not implemented.
substitutions:
  rflink_full_json_parts: "false"
  rflink_api_snapshot_interval: 1s

esphome:
  name: rflink-esphome
  friendly_name: RFLink ESPHome

esp8266:
  board: nodemcuv2

# Data only. Remote definitions are below. Remove old all-data/gestures packages.
packages:
  rflink_api:
    url: https://github.com/vicktor1979/esphome-rflink
    ref: v0.1.9
    refresh: 5min
    files:
      - packages/rflink-ha-data-only.yaml

external_components:
  - source: github://vicktor1979/esphome-rflink@v0.1.9
    components: [rflink, remote_receiver, rflink_remote]
    refresh: 5min

api:
  encryption:
    key: !secret rflink_api_key
  reboot_timeout: 0s

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

logger:
  level: INFO
  # Only the decoded RFLink message tag is allowed at DEBUG; the HA switch
  # decides whether those lines are actually emitted.
  logs:
    rflink: DEBUG

ota:
  - platform: esphome
    password: !secret ota_password
    # The RFLink component owns the full stop/restart sequence.
    on_begin:
      then:
        - lambda: id(rf_bridge).set_ota_active(true);
    on_error:
      then:
        - lambda: id(rf_bridge).set_ota_active(false);

remote_receiver:
  id: rf_receiver
  capture_enabled: false  # stored BEFORE setup: no RX interrupt while connecting
  high_frequency: false  # CUSTOM rxgate2 option; IRQ capture stays active after API connects
  pin:
    number: GPIO5
    inverted: false
    mode: INPUT
  filter: 100us
  idle: 5ms
  buffer_size: 1200b
  # No raw dump/logging in normal operation. Frame/recovery counters are internal.

rflink:
  id: rf_bridge
  receiver_id: rf_receiver

  rx_plugins: all
  plugin_profile: legacy

  # Built-in Wi-Fi + HA API gate, 5 s settle, monitoring/build/health entities.
  # Replaces the old YAML globals + 1 s/10 s interval lambdas.
  auto_start: true

  # All legacy decoders are compiled, but only the listed plugins
  # can be enabled at runtime.
  # Plugin 001 is always enabled.
  # Plugin 254 is the unsupported-signal diagnostic fallback
  # and defaults to OFF.
  plugin_switches:
    restore: true
    plugins:
      - plugin_id: 30
        id: rf_plugin_030
      - plugin_id: 61
        id: rf_plugin_061
      - plugin_id: 254
        id: rf_plugin_254

    active_plugins:
      name: "RFLink aktív pluginok"

    unsupported_signal:
      signal:
        name: "RFLink ismeretlen jel"
      pulse_count:
        name: "RFLink ismeretlen jel impulzusszám"

  # Fast production default. Turn on the HA switch below only while debugging.
  log_messages: false

  on_message:
    - then:
        - script.execute:
            id: rflink_api_process
            message: !lambda return x;

switch:
  # The getter reflects automatic timeout too; learning is OFF after reboot.
  - platform: template
    id: rf_learning_switch
    name: "RF tanuló mód"
    icon: mdi:remote
    entity_category: config
    lambda: return id(rf_remotes).is_learning_enabled();
    turn_on_action:
      - lambda: id(rf_remotes).set_learning_enabled(true);
    turn_off_action:
      - lambda: id(rf_remotes).set_learning_enabled(false);

  - platform: template
    id: rf_verbose_log
    name: "RFLink részletes napló"
    icon: mdi:text-box-search-outline
    entity_category: diagnostic
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - lambda: id(rf_bridge).set_log_messages(true);
    turn_off_action:
      - lambda: id(rf_bridge).set_log_messages(false);

# A future OTA can be performed with RF completely inactive in safe mode.
button:
  - platform: safe_mode
    name: "RFLink OTA helyreállítás"
    entity_category: config


  - platform: template
    name: "RF debug 60 másodperc"
    icon: mdi:bug-outline
    entity_category: config
    on_press:
      - switch.turn_on: rf_plugin_254
      - delay: 60s
      - switch.turn_off: rf_plugin_254

  - platform: template
    name: "RF pluginok alaphelyzet"
    icon: mdi:restore
    entity_category: config
    on_press:
      - switch.turn_on: rf_plugin_030
      - switch.turn_on: rf_plugin_061
      - switch.turn_off: rf_plugin_254

  - platform: template
    name: "RF tanulás indítása"
    icon: mdi:remote
    entity_category: config
    on_press:
      - lambda: id(rf_remotes).set_learning_enabled(true);


# v0.1.9: shared timing and learning. No hard-coded remote identities here.

rflink_remote:
  id: rf_remotes
  rflink_id: rf_bridge
  timing:
    release_timeout: 180ms
    hold_release_timeout: 450ms
    repeat_fresh_timeout: 180ms
    multi_click_timeout: 350ms
    hold_time: 700ms
    repeat_interval: 250ms
    max_press_time: 30s
  learning:
    enabled: false
    duration: 60s
    max_signals: 4
    min_frames: 3
    log_events: true
    signal:
      id: rf_learning_signal
      name: "RF tanuló jel"
    gesture:
      id: rf_learning_gesture
      name: "RF tanuló gesztus"

# Add/delete remotes HERE. One entry = one exact protocol/ID/button/command.
# Quoting numeric-looking RF codes is important: do not lose leading zeros.
# Remote examples:
#   examples/fragments/new-ev1527-remote.yaml
#   examples/fragments/ev1527-light-control.yaml
#   examples/fragments/generic-message-protocol.yaml
