# Historical example path, migrated to native sensor platform in v0.2.1.2.
# Replaces the former generated template/script and binary battery example.
# Battery is now numeric; update any old binary_sensor automation references.
# FRAGMENT v0.2.1.2: exact-device sensors through the native RFLink platform.
# Add rflink_sensor to your existing external_components.components list.
# Replace the example protocol and RF ID; add its plugin to rflink.rx_plugins.
# Cresta requires 34, e.g. rx_plugins: [30, 34, 40, 61, 254].
# The matching switch is generated automatically and must be ON for reception.
# No weather package or per-device script.execute call is required.
# This Cresta example is not an identified real user device.
sensor:
  - platform: rflink_sensor
    id: pelda_kert_temp
    name: "PÉLDA Kert hőmérséklet"
    rflink_id: rf_bridge
    protocol: "Cresta"
    rf_id: "CSERELD_A_SAJAT_IDRA"
    field: TEMP
    filters:
      - timeout: 60min

  - platform: rflink_sensor
    id: pelda_kert_hum
    name: "PÉLDA Kert páratartalom"
    rflink_id: rf_bridge
    protocol: "Cresta"
    rf_id: "CSERELD_A_SAJAT_IDRA"
    field: HUM
    filters:
      - timeout: 60min

  - platform: rflink_sensor
    id: pelda_kert_battery
    name: "PÉLDA Kert elemállapot"
    rflink_id: rf_bridge
    protocol: "Cresta"
    rf_id: "CSERELD_A_SAJAT_IDRA"
    field: BAT
    filters:
      - timeout: 60min
    # LOW=0; OK=100. An indicator, not a measured percentage.

# timeout is optional: after 60 min without a valid matching field, that sensor
# becomes unknown. Omit filters to retain the last value until reboot.
# Missing TEMP/HUM/BAT is never invented. Mebus currently sends only TEMP.
# Keep the existing rflink_api_process call if using data-only diagnostics.
