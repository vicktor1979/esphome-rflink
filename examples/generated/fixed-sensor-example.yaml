# GENERATED EXAMPLE: per-device RFLink field package for an exact NAME + ID.
# This is not a complete ESPHome firmware YAML.
#
# A package like this can be generated with tools/make_rf_device.py.
# Replace the example protocol/ID with values observed from your own RF device.
#
# Numeric/binary state becomes unknown on expiry; no fake OFF/OK readings.
# Values from other devices cannot overwrite these entities.
# RF events while the API-dependent decoder is paused are not buffered.
# Text fields remain last-known; numeric/binary expiry is independent.

json:
sensor:
- platform: template
  id: pelda_kert_temp
  name: PÉLDA Kert hőmérséklet
  icon: mdi:thermometer
  internal: false
  accuracy_decimals: 1
  update_interval: never
  filters:
  - timeout: 60min
  unit_of_measurement: °C
  device_class: temperature
  state_class: measurement
- platform: template
  id: pelda_kert_hum
  name: PÉLDA Kert páratartalom
  icon: mdi:water-percent
  internal: false
  accuracy_decimals: 0
  update_interval: never
  filters:
  - timeout: 60min
  unit_of_measurement: '%'
  device_class: humidity
  state_class: measurement
binary_sensor:
- platform: template
  id: pelda_kert_bat
  name: PÉLDA Kert alacsony elem
  device_class: battery
  internal: false
  filters:
  - timeout: 60min
  entity_category: diagnostic
script:
- id: pelda_kert_process
  mode: queued
  max_runs: 5
  parameters:
    message: string
  then:
  - lambda: |-
      const bool valid = json::parse_json(message, [&](JsonObject root) -> bool {
        namespace data = esphome::rflink_data;
        const std::string protocol = root["NAME"] | "";
        const std::string device = root["ID"] | "";
        if (protocol != "Cresta" || device != "CSERELD_A_SAJAT_IDRA") return true;
        data::publish_number(id(pelda_kert_temp), data::number(root, data::TEMP), false);
        data::publish_number(id(pelda_kert_hum), data::number(root, data::HUM), false);
        const std::string value_BAT = root["BAT"] | "";
        data::publish_binary(id(pelda_kert_bat), data::binary_value(value_BAT, "LOW", "OK"), !root["BAT"].isNull(), false);
        return true;
      });
      if (!valid) ESP_LOGW("rflink.device", "Hibas JSON a rogzitett RF-eszkozhoz.");
rflink:
  on_message:
  - then:
    - script.execute:
        id: pelda_kert_process
        message: !lambda 'return x;'
