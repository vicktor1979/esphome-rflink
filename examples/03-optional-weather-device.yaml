# FRAGMENT: an OPTIONAL per-device weather sensor. Do not enable with example IDs.
# For local use, put the packages directory beside the device YAML.
# Replace protocol and RF ID with the actual values from RF utolsó üzenet.
# This demonstrates a Cresta device. It is NOT an identified real user device.
packages:
  rflink_api: !include packages/rflink-ha-api.yaml
  outdoor_weather: !include
    file: packages/rflink-ha-weather.yaml
    vars:
      sensor_prefix: outdoor_weather
      sensor_name: "Udvari érzékelő"
      rf_protocol: "Cresta"
      rf_device_id: "REPLACE_WITH_ACTUAL_ID"
      stale_after: 60min

rflink:
  # KEEP your existing id, receiver_id, rx_plugins, etc.
  on_message:
    then:
      - script.execute:
          id: rflink_api_process
          message: !lambda return x;
      - script.execute:
          id: outdoor_weather_process
          message: !lambda return x;

# Repeat the weather include with a different sensor_prefix and RF ID for
# another device, and add a call to its own <sensor_prefix>_process script.
# Missing TEMP/HUM/BAT fields are not invented. A Mebus device that sends only
# TEMP will leave humidity/battery entities unknown.
