# FRAGMENT v0.2.1.2: GitHub component source + optional data diagnostics.
# Merge with existing blocks. Do not load old api/all-data/gestures packages.
# After uploading changed files, use refresh: 0s once to fetch the new sources.
external_components:
  - source: github://vicktor1979/esphome-rflink@main
    components: [rflink, remote_receiver, rflink_remote, rflink_sensor]
    refresh: 5min

packages:
  rflink_native:
    url: https://github.com/vicktor1979/esphome-rflink
    ref: main
    refresh: 5min
    files:
      - packages/rflink-ha-data-only.yaml

rflink:
  # KEEP your existing id: rf_bridge, receiver_id, plugin options, auto_start.
  on_message:
    then:
      - script.execute:
          id: rflink_api_process
          message: !lambda return x;

# Device sensors: examples/rflink-sensors.yaml or
# examples/fragments/03-optional-weather-device.yaml.
# They subscribe directly; do not add any per-device script calls.
# Remotes: event platform rflink_remote; see new-ev1527-remote.yaml.
