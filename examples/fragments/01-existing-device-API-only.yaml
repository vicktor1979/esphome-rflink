# FRAGMENT v0.2.1.2: merge into YOUR EXISTING device YAML.
# Keep your receiver pin, capture mode, OTA and Wi-Fi settings.
# Remove old api/all-data/gestures packages when migrating to data-only.
external_components:
  - source: github://vicktor1979/esphome-rflink@main
    components: [rflink, remote_receiver, rflink_remote, rflink_sensor]
    refresh: 5min

packages:
  rflink_api:
    url: https://github.com/vicktor1979/esphome-rflink
    ref: main
    refresh: 5min
    files:
      - packages/rflink-ha-data-only.yaml

# Keep existing API settings/key; merge, do not duplicate.
api:
  encryption:
    key: !secret rflink_api_key
  reboot_timeout: 0s

rflink:
  # KEEP existing id: rf_bridge, receiver_id, rx_plugins and other options.
  on_message:
    then:
      - script.execute:
          id: rflink_api_process
          message: !lambda return x;

# The above script is shared diagnostics only.
# Sensor data needs no on_message script: use sensor platform rflink_sensor.
# Button actions use event platform rflink_remote with your rf_remotes hub.
# API-only mode: remove old mqtt: block and mqtt.publish actions.
